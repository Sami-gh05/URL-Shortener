[tool.poetry]
name = "url-shortener"
version = "0.1.0"
description = ""
authors = ["Sam Ghorbani <sam.ghorbani@example.com>", "Nima Sayad <nima.sayad@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.23"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
schedule = "^1.2.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
httpx = "^0.27.0"
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.6.9"
black = "^24.8.0"
isort = "^5.13.2"

[tool.poetry.scripts]
url_shortener = "url_shortener.api.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
